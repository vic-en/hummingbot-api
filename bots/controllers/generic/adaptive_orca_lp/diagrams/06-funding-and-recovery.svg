<text x="925.0" y="515.6" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="16" fill="#1e1e1e" text-anchor="middle">market swap out of the</text>
<text x="925.0" y="536.4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="16" fill="#1e1e1e" text-anchor="middle">SURPLUS token only</text>
<rect x="785" y="602" width="280" height="80" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
