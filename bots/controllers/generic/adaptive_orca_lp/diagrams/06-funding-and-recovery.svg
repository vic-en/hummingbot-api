<text x="1205.0" y="555.6" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="16" fill="#1e1e1e" text-anchor="middle">-&gt; capital shortfall,</text>
<text x="1205.0" y="576.4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="16" fill="#1e1e1e" text-anchor="middle">not a mix problem</text>
