<rect x="1060.5" y="445.0" width="35.2" height="18" fill="#ffffff" opacity="0.85"/>
<text x="1062.5" y="460.0" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="14" fill="#5c5f66" text-anchor="start">both</text>
<rect x="642.6" y="399.0" width="66.4" height="18" fill="#ffffff" opacity="0.85"/>
<text x="705.0" y="414.0" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="14" fill="#5c5f66" text-anchor="end">re-quote</text>
<text x="60" y="662.0" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="15" fill="#5c5f66">Recovery runs before any capital is deployed, so a restart can never stack a</text>
<text x="60" y="682.2" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="15" fill="#5c5f66">second position. A failed query leaves the flag unset and retries next cycle.</text>
<text x="760" y="722.0" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="15" fill="#5c5f66">A re-centring CLMM position converts toward one token on every move, so the</text>
<text x="760" y="742.2" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="15" fill="#5c5f66">wallet mix drifts away from what the next range needs. The swap never eats the</text>
<text x="760" y="762.5" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" font-size="15" fill="#5c5f66">base reserved for the position plus the chain's native reserve (0.1 SOL).</text>
</svg>